name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.platform }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, os: windows-latest, preset: x64-Debug }
          - { platform: Windows, os: windows-latest, preset: x64-Release }
          - { platform: Windows, os: windows-latest, preset: x64-clang-cl-Debug }
          - { platform: Windows, os: windows-latest, preset: x64-clang-cl-Release }
          - { platform: macOS, os: macos-latest, preset: macos-debug }
          - { platform: macOS, os: macos-latest, preset: macos-release }
          - { platform: Linux, os: ubuntu-latest, preset: linux-debug }
          - { platform: Linux, os: ubuntu-latest, preset: linux-release }
          - { platform: Linux, os: ubuntu-latest, preset: linux-clang-debug }
          - { platform: Linux, os: ubuntu-latest, preset: linux-clang-release }

    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC developer environment
        if: matrix.platform == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # Re-run just the failed tests and publish their output as an
      # annotation, so a failure can be read without logging in to GitHub.
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} --rerun-failed --output-on-failure > ctest-failures.log 2>&1 || true
          python3 .github/scripts/report_ctest_failures.py ctest-failures.log "${{ matrix.preset }}"
